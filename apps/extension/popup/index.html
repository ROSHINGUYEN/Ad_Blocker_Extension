<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>SHIORI AD CLEANER</title>
  <style>
    :root {
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --bg-dark: #090d16;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    body {
      width: 360px;
      padding: 16px;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      user-select: none;
    }
    
    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
      color: #0f172a;
      box-shadow: 0 0 10px var(--primary-glow);
    }
    .brand-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #38bdf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-protect {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: #4ade80;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 3px 8px;
      border-radius: 20px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
    }

    /* Current Site Banner */
    .site-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .site-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .site-domain {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .toggle-switch {
      position: relative;
      width: 38px;
      height: 20px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background: #334155; border-radius: 20px; transition: 0.3s;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background: white; border-radius: 50%; transition: 0.3s;
    }
    input:checked + .slider { background: #0284c7; box-shadow: 0 0 10px var(--primary-glow); }
    input:checked + .slider:before { transform: translateX(18px); }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 8px;
      border-radius: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: #f1f5f9;
      font-feature-settings: "tnum";
    }
    .stat-val.highlight { color: #38bdf8; text-shadow: 0 0 8px var(--primary-glow); }
    .stat-lbl {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      line-height: 1.2;
    }

    /* Engine Status */
    .engine-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .engine-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .engine-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 12px;
    }
    .engine-name {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
    }
    .engine-icon { font-size: 13px; }
    .engine-pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
    }
    .engine-pill.yt {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
      padding-top: 4px;
    }
    .btn-clean-now {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      transition: 0.2s;
    }
    .btn-clean-now:hover { filter: brightness(1.15); transform: translateY(-1px); }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <img src="../icons/icon48.png" alt="Shiori Shield" width="24" height="24" style="filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.5)); border-radius: 4px;">
      <div class="brand-name">SHIORI AD CLEANER</div>
    </div>
    <div class="badge-protect">
      <span class="pulse-dot"></span>
      <span>ACTIVE</span>
    </div>
  </div>

  <!-- Current Site -->
  <div class="site-card">
    <div class="site-info">
      <span class="site-label">Trang hiện tại</span>
      <span class="site-domain" id="current-domain">Đang phát hiện...</span>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="site-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-val highlight" id="stat-popups">0</span>
      <span class="stat-lbl">Tab nhảy<br>đã chặn</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" id="stat-dom">0</span>
      <span class="stat-lbl">Banner QC<br>đã ẩn</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" id="stat-network">0</span>
      <span class="stat-lbl">Requests<br>đã lọc</span>
    </div>
  </div>

  <!-- Engines Detail -->
  <div class="engine-panel">
    <div class="engine-title">Mô-đun bảo vệ hoạt động</div>
    <div class="engine-row">
      <span class="engine-name"><span class="engine-icon">🛡️</span> Pop-under & Click Hijack</span>
      <span class="engine-pill">Zero-Trust</span>
    </div>
    <div class="engine-row">
      <span class="engine-name"><span class="engine-icon">▶️</span> YouTube Video Ad Skip</span>
      <span class="engine-pill yt">16x Fast-Skip</span>
    </div>
    <div class="engine-row">
      <span class="engine-name"><span class="engine-icon">🧹</span> Floating Modal & Sticky Ads</span>
      <span class="engine-pill">Geometric</span>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="footer">
    <button class="btn-clean-now" id="btn-ram" style="background: linear-gradient(135deg, #10b981, #059669); margin-right: 6px;">⚡ Tối ưu RAM</button>
    <button class="btn-clean-now" id="btn-refresh">Quét lại trang</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
